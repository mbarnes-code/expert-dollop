# Security Onion - Zeek Pipeline

input {
  beats {
    port => 5050
    tags => ["securityonion", "zeek"]
  }
}

filter {
  if "zeek" in [tags] {
    # Add index metadata
    mutate {
      add_field => { "[@metadata][index_prefix]" => "zeek" }
    }

    # Parse JSON from Zeek logs
    if [message] =~ /^\{/ {
      json {
        source => "message"
        remove_field => ["message"]
      }
    }

    # Enrich based on log type
    if [event][dataset] {
      mutate {
        add_field => { "zeek_log_type" => "%{[event][dataset]}" }
      }
    }

    # DNS analysis
    if [event][dataset] == "zeek.dns" {
      mutate {
        add_tag => ["dns"]
      }

      # Detect DNS tunneling
      if [dns][question][name] {
        ruby {
          code => '
            query = event.get("[dns][question][name]")
            if query && query.length > 50
              event.set("dns_tunnel_suspected", true)
              event.tag("dns_tunneling")
            end
          '
        }
      }
    }

    # HTTP analysis
    if [event][dataset] == "zeek.http" {
      mutate {
        add_tag => ["http"]
      }

      # User agent analysis
      if [user_agent][original] =~ /(?i)(curl|wget|python|powershell|nikto|sqlmap|nmap)/ {
        mutate {
          add_tag => ["suspicious_user_agent"]
        }
      }
    }

    # SSL/TLS analysis
    if [event][dataset] == "zeek.ssl" {
      mutate {
        add_tag => ["tls"]
      }

      # Detect weak ciphers
      if [tls][cipher] =~ /(?i)(RC4|DES|MD5|NULL)/ {
        mutate {
          add_tag => ["weak_cipher"]
        }
      }
    }

    # File extraction
    if [event][dataset] == "zeek.files" {
      mutate {
        add_tag => ["file"]
      }

      # Detect suspicious file types
      if [file][mime_type] =~ /(?i)(executable|script|compressed)/ {
        mutate {
          add_tag => ["suspicious_file"]
        }
      }
    }

    # Connection analysis
    if [event][dataset] == "zeek.conn" {
      mutate {
        add_tag => ["connection"]
      }

      # Calculate connection duration
      if [event][start] and [event][end] {
        ruby {
          code => '
            start_time = event.get("[event][start]")
            end_time = event.get("[event][end]")
            if start_time && end_time
              duration = (Time.parse(end_time) - Time.parse(start_time)).to_i
              event.set("connection_duration", duration)
            end
          '
        }
      }
    }

    # Geolocation enrichment
    if [destination][ip] and [destination][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.|127\.)/ {
      geoip {
        source => "[destination][ip]"
        target => "[destination][geo]"
      }
    }

    if [source][ip] and [source][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.|127\.)/ {
      geoip {
        source => "[source][ip]"
        target => "[source][geo]"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "zeek-%{[event][dataset]}-%{+YYYY.MM.dd}"
    template_name => "network-data"
  }

  # stdout { codec => rubydebug }
}
