# Security Onion - Suricata Pipeline

input {
  beats {
    port => 5051
    tags => ["securityonion", "suricata"]
  }
}

filter {
  if "suricata" in [tags] {
    # Add index metadata
    mutate {
      add_field => { "[@metadata][index_prefix]" => "suricata" }
    }

    # Parse JSON from Suricata
    if [message] =~ /^\{/ {
      json {
        source => "message"
        remove_field => ["message"]
      }
    }

    # Event type classification
    if [event][type] == "alert" {
      mutate {
        add_tag => ["alert"]
      }

      # Severity classification
      if [alert][severity] {
        if [alert][severity] == 1 {
          mutate {
            add_field => { "severity_label" => "critical" }
            add_tag => ["critical"]
          }
        } else if [alert][severity] == 2 {
          mutate {
            add_field => { "severity_label" => "high" }
            add_tag => ["high"]
          }
        } else if [alert][severity] == 3 {
          mutate {
            add_field => { "severity_label" => "medium" }
            add_tag => ["medium"]
          }
        }
      }

      # Alert category enrichment
      if [alert][category] {
        mutate {
          lowercase => ["[alert][category]"]
        }

        # Tag by attack category
        if [alert][category] =~ /exploit/ {
          mutate { add_tag => ["exploitation"] }
        }
        if [alert][category] =~ /malware/ {
          mutate { add_tag => ["malware"] }
        }
        if [alert][category] =~ /trojan/ {
          mutate { add_tag => ["trojan"] }
        }
        if [alert][category] =~ /scan/ {
          mutate { add_tag => ["scanning"] }
        }
        if [alert][category] =~ /policy/ {
          mutate { add_tag => ["policy_violation"] }
        }
      }
    }

    # Flow analysis
    if [event][type] == "flow" {
      mutate {
        add_tag => ["flow"]
      }

      # Calculate flow metrics
      if [network][bytes] and [network][packets] {
        ruby {
          code => '
            bytes = event.get("[network][bytes]")
            packets = event.get("[network][packets]")
            if bytes && packets && packets > 0
              avg_packet_size = bytes / packets
              event.set("avg_packet_size", avg_packet_size)
            end
          '
        }
      }
    }

    # HTTP events
    if [event][type] == "http" {
      mutate {
        add_tag => ["http"]
      }

      # Detect suspicious HTTP
      if [http][request][method] == "POST" and [http][response][status_code] == 200 {
        if [http][request][referrer] == "" or ![http][request][referrer] {
          mutate {
            add_tag => ["suspicious_http"]
          }
        }
      }
    }

    # DNS events
    if [event][type] == "dns" {
      mutate {
        add_tag => ["dns"]
      }

      # DNS response code analysis
      if [dns][rcode] and [dns][rcode] != "NOERROR" {
        mutate {
          add_tag => ["dns_error"]
        }
      }
    }

    # TLS events
    if [event][type] == "tls" {
      mutate {
        add_tag => ["tls"]
      }

      # Detect certificate issues
      if [tls][notbefore] and [tls][notafter] {
        ruby {
          code => '
            require "time"
            notbefore = event.get("[tls][notbefore]")
            notafter = event.get("[tls][notafter]")
            now = Time.now
            
            if notbefore && notafter
              begin
                before_time = Time.parse(notbefore)
                after_time = Time.parse(notafter)
                
                if now < before_time || now > after_time
                  event.tag("invalid_certificate")
                end
              rescue
                # Parsing failed, skip
              end
            end
          '
        }
      }
    }

    # Geolocation enrichment
    if [destination][ip] and [destination][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.|127\.)/ {
      geoip {
        source => "[destination][ip]"
        target => "[destination][geo]"
      }
    }

    if [source][ip] and [source][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.|127\.)/ {
      geoip {
        source => "[source][ip]"
        target => "[source][geo]"
      }
    }

    # Add community ID for correlation
    if [network][community_id] {
      mutate {
        add_field => { "[@metadata][community_id]" => "%{[network][community_id]}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "suricata-%{[event][type]}-%{+YYYY.MM.dd}"
    template_name => "network-data"
  }

  # Separate index for alerts
  if "alert" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "suricata-alerts-%{+YYYY.MM.dd}"
    }
  }

  # stdout { codec => rubydebug }
}
