# Security Onion - PCAP Metadata Pipeline

input {
  beats {
    port => 5052
    tags => ["securityonion", "pcap"]
  }
}

filter {
  if "pcap" in [tags] {
    # Add index metadata
    mutate {
      add_field => { "[@metadata][index_prefix]" => "pcap" }
    }

    # Parse PCAP metadata (from tools like tcpdump, tshark)
    if [message] =~ /^\{/ {
      json {
        source => "message"
        remove_field => ["message"]
      }
    }

    # Protocol classification
    if [network][protocol] {
      mutate {
        lowercase => ["[network][protocol]"]
      }

      # Add protocol tags
      if [network][protocol] == "tcp" {
        mutate { add_tag => ["tcp"] }
      } else if [network][protocol] == "udp" {
        mutate { add_tag => ["udp"] }
      } else if [network][protocol] == "icmp" {
        mutate { add_tag => ["icmp"] }
      }
    }

    # Port classification
    if [destination][port] {
      # Common ports
      if [destination][port] == 80 {
        mutate { add_field => { "service" => "http" } }
      } else if [destination][port] == 443 {
        mutate { add_field => { "service" => "https" } }
      } else if [destination][port] == 22 {
        mutate { add_field => { "service" => "ssh" } }
      } else if [destination][port] == 25 {
        mutate { add_field => { "service" => "smtp" } }
      } else if [destination][port] == 53 {
        mutate { add_field => { "service" => "dns" } }
      } else if [destination][port] == 3389 {
        mutate { add_field => { "service" => "rdp" } }
      } else if [destination][port] == 445 {
        mutate { add_field => { "service" => "smb" } }
      }

      # Detect unusual ports
      if [destination][port] > 49152 {
        mutate { add_tag => ["high_port"] }
      }
    }

    # Calculate packet rate and bandwidth
    if [network][bytes] and [network][packets] {
      ruby {
        code => '
          bytes = event.get("[network][bytes]")
          packets = event.get("[network][packets]")
          
          if bytes && packets && packets > 0
            avg_packet_size = bytes / packets
            event.set("avg_packet_size", avg_packet_size)
            
            # Detect potential data exfiltration (large transfers)
            if bytes > 10485760  # 10 MB
              event.tag("large_transfer")
            end
          end
        '
      }
    }

    # Detect internal to external communication
    if [source][ip] and [destination][ip] {
      ruby {
        code => '
          src = event.get("[source][ip]")
          dst = event.get("[destination][ip]")
          
          internal_ranges = [
            /^10\./,
            /^172\.(1[6-9]|2[0-9]|3[0-1])\./,
            /^192\.168\./
          ]
          
          src_internal = internal_ranges.any? { |range| src =~ range }
          dst_internal = internal_ranges.any? { |range| dst =~ range }
          
          if src_internal && !dst_internal
            event.set("direction", "outbound")
            event.tag("outbound")
          elsif !src_internal && dst_internal
            event.set("direction", "inbound")
            event.tag("inbound")
          else
            event.set("direction", "internal")
            event.tag("internal")
          end
        '
      }
    }

    # Geolocation for external IPs
    if "outbound" in [tags] or "inbound" in [tags] {
      if [destination][ip] and [destination][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.|127\.)/ {
        geoip {
          source => "[destination][ip]"
          target => "[destination][geo]"
        }
      }

      if [source][ip] and [source][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.|127\.)/ {
        geoip {
          source => "[source][ip]"
          target => "[source][geo]"
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pcap-%{+YYYY.MM.dd}"
    template_name => "network-data"
  }

  # Separate index for large transfers (potential exfiltration)
  if "large_transfer" in [tags] and "outbound" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "pcap-large-transfers-%{+YYYY.MM.dd}"
    }
  }

  # stdout { codec => rubydebug }
}
