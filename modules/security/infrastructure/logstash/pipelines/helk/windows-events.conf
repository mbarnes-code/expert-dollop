# HELK - Windows Events Pipeline

input {
  beats {
    port => 5044
    tags => ["helk", "windows", "events"]
  }
}

filter {
  # Parse Windows Event Log
  if "windows" in [tags] {
    # Add event classification
    mutate {
      add_field => { "[@metadata][index_prefix]" => "winlogbeat" }
    }

    # Enrich event data
    if [event][code] {
      mutate {
        add_field => { "event_id" => "%{[event][code]}" }
      }
    }

    # Parse command line for process events
    if [event][code] == "4688" or [event][code] == "1" {
      if [process][command_line] {
        # Extract executables from command line
        grok {
          match => { "[process][command_line]" => "(?<executable>[^\s]+)" }
          tag_on_failure => []
        }
      }
    }

    # Authentication events
    if [event][code] in ["4624", "4625", "4648"] {
      mutate {
        add_tag => ["authentication"]
      }
    }

    # Privilege escalation
    if [event][code] in ["4672", "4673"] {
      mutate {
        add_tag => ["privilege_escalation"]
      }
    }

    # Account management
    if [event][code] in ["4720", "4722", "4723", "4724", "4725", "4726", "4738"] {
      mutate {
        add_tag => ["account_management"]
      }
    }

    # Process creation
    if [event][code] == "4688" {
      mutate {
        add_tag => ["process_creation"]
      }
    }

    # Add geolocation for source IPs
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "[source][geo]"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "winlogbeat-%{+YYYY.MM.dd}"
    template_name => "windows-logs"
  }

  # Debug output (optional, remove in production)
  # stdout { codec => rubydebug }
}
