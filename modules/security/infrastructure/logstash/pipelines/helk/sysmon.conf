# HELK - Sysmon Pipeline

input {
  beats {
    port => 5045
    tags => ["helk", "sysmon"]
  }
}

filter {
  if "sysmon" in [tags] {
    # Add index metadata
    mutate {
      add_field => { "[@metadata][index_prefix]" => "sysmon" }
    }

    # Sysmon Event ID classification
    if [event][code] == "1" {
      mutate {
        add_tag => ["process_creation"]
      }
    }

    if [event][code] == "3" {
      mutate {
        add_tag => ["network_connection"]
      }
    }

    if [event][code] == "7" {
      mutate {
        add_tag => ["image_loaded"]
      }
    }

    if [event][code] == "8" {
      mutate {
        add_tag => ["create_remote_thread"]
      }
    }

    if [event][code] == "10" {
      mutate {
        add_tag => ["process_access"]
      }
    }

    if [event][code] == "11" {
      mutate {
        add_tag => ["file_creation"]
      }
    }

    if [event][code] == "12" or [event][code] == "13" or [event][code] == "14" {
      mutate {
        add_tag => ["registry_event"]
      }
    }

    if [event][code] == "22" {
      mutate {
        add_tag => ["dns_query"]
      }
    }

    # Extract parent-child process relationships
    if [process][parent][name] and [process][name] {
      mutate {
        add_field => { "process_chain" => "%{[process][parent][name]} -> %{[process][name]}" }
      }
    }

    # Hash enrichment
    if [file][hash][sha256] {
      # Could add hash lookup against threat intelligence here
      mutate {
        add_field => { "hash_present" => "true" }
      }
    }

    # Geolocation for network events
    if [destination][ip] and [destination][ip] !~ /^(10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.)/ {
      geoip {
        source => "[destination][ip]"
        target => "[destination][geo]"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sysmon-%{+YYYY.MM.dd}"
    template_name => "windows-logs"
  }

  # stdout { codec => rubydebug }
}
