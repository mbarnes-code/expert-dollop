# HELK - PowerShell Pipeline

input {
  beats {
    port => 5046
    tags => ["helk", "powershell"]
  }
}

filter {
  if "powershell" in [tags] {
    # Add index metadata
    mutate {
      add_field => { "[@metadata][index_prefix]" => "powershell" }
    }

    # PowerShell script block logging (Event ID 4104)
    if [event][code] == "4104" {
      mutate {
        add_tag => ["script_block"]
      }

      # Detect suspicious PowerShell patterns
      if [message] =~ /(?i)(invoke-expression|iex|invoke-webrequest|downloadstring|invoke-command|invoke-mimikatz|invoke-shellcode|encodedcommand|-enc|-e )/ {
        mutate {
          add_tag => ["suspicious_powershell"]
        }
      }

      # Detect obfuscation
      if [message] =~ /(?i)(join|split|replace|char|convert)/ {
        mutate {
          add_tag => ["obfuscation"]
        }
      }

      # Detect common attack frameworks
      if [message] =~ /(?i)(empire|covenant|powersploit|nishang|powerup|powerview)/ {
        mutate {
          add_tag => ["attack_framework"]
        }
      }
    }

    # PowerShell module logging (Event ID 4103)
    if [event][code] == "4103" {
      mutate {
        add_tag => ["module_logging"]
      }
    }

    # PowerShell operational log
    if [event][code] in ["4100", "4101", "4102"] {
      mutate {
        add_tag => ["operational"]
      }
    }

    # Extract command from message
    if [message] {
      grok {
        match => { "message" => "CommandLine=%{GREEDYDATA:powershell_command}" }
        tag_on_failure => []
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "powershell-%{+YYYY.MM.dd}"
    template_name => "windows-logs"
  }

  # Alert on suspicious PowerShell to separate index
  if "suspicious_powershell" in [tags] or "attack_framework" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "powershell-alerts-%{+YYYY.MM.dd}"
    }
  }

  # stdout { codec => rubydebug }
}
