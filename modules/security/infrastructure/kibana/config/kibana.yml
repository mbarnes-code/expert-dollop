# Kibana Configuration for Security Domain

# Server settings
server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch connection
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.requestTimeout: 30000
elasticsearch.pingTimeout: 30000

# Security settings (disabled for development)
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "min-32-byte-long-strong-encryption-key"

# Monitoring
monitoring.enabled: true
monitoring.kibana.collection.enabled: true

# Logging
logging.root.level: info
logging.appenders.default:
  type: console
  layout:
    type: pattern
    pattern: "[%date][%level][%logger] %message"

# Telemetry (disable for privacy)
telemetry.enabled: false
telemetry.optIn: false

# Saved Objects
savedObjects.maxImportPayloadBytes: 26214400

# Dashboard settings
kibana.defaultAppId: "discover"

# Advanced settings
xpack.reporting.enabled: true
xpack.canvas.enabled: true
xpack.ml.enabled: true
xpack.graph.enabled: true

# Data views
data.search.timeout: 300000

# Session timeout
xpack.security.session.idleTimeout: "8h"
xpack.security.session.lifespan: "30d"
